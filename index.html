  if(shield>0){const fr=Math.floor(t/3)%8;const sc=shieldHit>0?1.15:1+Math.sin(t*0.1)*0.03;ctx.globalAlpha=shieldHit>0?1:0.75+(shield>1?0.15:0);blit(SHF[fr],ship.x,ship.y,sc);if(shield>1){ctx.globalAlpha=0.5;blit(SHF[(fr+4)%8],ship.x,ship.y,sc*0.85);}ctx.globalAlpha=1;}
  drawGunMounts();}

function drawField(){ctx.save();ctx.beginPath();ctx.rect(X(PX),0,X(PW),H);ctx.clip();
  ctx.fillStyle='#04030a';ctx.fillRect(X(PX),0,X(PW),H);
  if(IMG.px_nebula){const layer=(nm,sp,al)=>{const im=IMG[nm];if(!im)return;const y=Math.floor((scroll*sp)%im.height);if(al!==undefined)ctx.globalAlpha=al;ctx.drawImage(im,0,0,X(PW),im.height,X(PX),y-im.height,X(PW),im.height);ctx.drawImage(im,0,0,X(PW),im.height,X(PX),y,X(PW),im.height);ctx.globalAlpha=1;};
    layer('px_nebula',0.35);layer('px_haze1',0.55,0.7);layer('px_stars_far',0.8,0.6);layer('px_haze2',1.0,0.5);layer('px_stars_mid',1.4,0.75);layer('px_stars_near',2.0,0.9);}
  else{ctx.globalAlpha=0.85;const sy=Math.floor(scroll);ctx.drawImage(BG,X(PX),sy-TH);ctx.drawImage(BG,X(PX),sy);ctx.globalAlpha=1;}
  for(const st of STARS){const yy=(st.y+scroll*1.6)%H;ctx.fillStyle=st.c;ctx.fillRect(X(PX)+st.x,Math.floor(yy),st.s,st.s);}
  for(const d of drops){const bob=Math.sin(t*0.15+d.y)*2,p=1+Math.sin(t*0.2+d.x)*0.08;
    if(d.k==='core'){if(!img('icon_core',d.x,d.y,0.7*p)){blit(CORE,d.x,d.y,1.4*p);}}
    else{const nm=d.k==='w'?'icon_w':d.k==='b'?'icon_b':'icon_s';if(!img(nm,d.x,d.y+bob,p)){const cap=d.k==='w'?CAP_W:d.k==='b'?CAP_B:CAP_S;blit(cap,d.x,d.y+bob,2);}txt(d.k.toUpperCase(),d.x+0.5,d.y+bob-7,C.s0,13,'center');txt(d.k.toUpperCase(),d.x,d.y+bob-8,C.white,13,'center');}}
  for(const e of enemies){
    if(e.k===0){if(!img('scout',e.x,e.y,1+Math.sin(e.t*0.15)*0.04)){const p=1.5+Math.sin(e.t*0.15)*0.12;blit(E1,e.x,e.y,p);}}
    else if(e.k===1){const wob=Math.sin(e.t*0.3);ctx.save();ctx.translate(X(e.x),X(e.y));ctx.rotate(wob*0.12);const b=IMG.bomber;if(b)ctx.drawImage(b,-b.width/2,-b.height/2);else ctx.drawImage(E2,-E2.width*0.75,-E2.height*0.75,E2.width*1.5,E2.height*1.5);ctx.restore();}
    else if(e.k===2){if(!img('frigate',e.x,e.y))blit(E3,e.x,e.y,1.5);if(e.ct<30&&Math.floor(e.ct/4)%2===0){ctx.fillStyle=C.magenta;ctx.fillRect(X(e.x)-9,X(e.y)+8,18,6);}}
    else{const sc=K/1.5,cx=X(e.x),cy=X(e.y);ctx.save();ctx.translate(cx*(1-sc),cy*(1-sc));ctx.scale(sc,sc);if(e.k===3)drawLurker(e);else drawCrawler(e);ctx.restore();}
    if(e.flash>0){ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.5;ctx.fillStyle=C.white;ctx.fillRect(X(e.x)-X(R[e.k]),X(e.y)-X(R[e.k]),X(R[e.k]*2),X(R[e.k]*2));ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  }
  drawBoss();
  for(const s of shots){ctx.save();ctx.translate(X(s.x),X(s.y));ctx.rotate(Math.atan2(s.vy,s.vx)+Math.PI/2);const b=BOLT[s.g];ctx.drawImage(b,-b.width/2,-12);ctx.restore();}
  for(const s of eshots){const nm=s.blue?'plasma_blue':'plasma_red';for(let k=1;k<=3;k++){if(!img(nm,s.x-s.vx*k*1.5,s.y-s.vy*k*1.5,1-k*0.2,0.35-k*0.1))blit(PLASMA[1],s.x-s.vx*k*1.5,s.y-s.vy*k*1.5,3-k*0.6);}ctx.globalAlpha=1;if(!img(nm,s.x,s.y,1+(t%8<4?0.1:0)))blit(PLASMA[t%8<4?0:1],s.x,s.y,3);}
  for(const b of booms){if(b.vx===undefined){const st=STRIP[b.kind||'exp_small'];const tot=b.kind==='hit'?8:24;const prog=(tot-b.life)/tot;if(!(st&&strip(b.kind,prog*st.n,b.x,b.y,b.kind==='exp_big'?1.1:b.kind==='exp_ring'?2.4:1.4))){const fr=Math.floor((24-b.life)/4);if(fr<6)blit(BOOMF[fr],b.x,b.y,b.sc);}}
    else{const f=b.life/24;ctx.fillStyle=f>0.6?C.white:f>0.35?C.yellow:f>0.15?C.orange:C.red;const sz=f>0.5?9:6;ctx.fillRect(X(b.x),X(b.y),sz,sz);}}
  for(const r of rings){ctx.globalAlpha=r.life/(r.big?46:30);ctx.strokeStyle=r.col;ctx.lineWidth=r.big?6:3;ctx.beginPath();ctx.arc(X(r.x),X(r.y),X(r.r),0,6.283);ctx.stroke();if(r.big){ctx.lineWidth=2;ctx.beginPath();ctx.arc(X(r.x),X(r.y),X(r.r*0.7),0,6.283);ctx.stroke();}}ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.life/20);txt(f.txt,f.x+1,f.y+1,C.s0,f.big?22:13,'center');txt(f.txt,f.x,f.y,f.col,f.big?22:13,'center');}ctx.globalAlpha=1;
  if(bombFx>0){ctx.globalAlpha=bombFx/40*0.6;ctx.fillStyle=C.G;ctx.fillRect(X(PX),0,X(PW),H);ctx.globalAlpha=1;}
  drawShip();ctx.restore();}
function drawPanels(){bevel(0,0,PX,LH,false);bevel(PX+PW,0,LW-PX-PW,LH,false);bevel(PX-6,0,6,LH,true);bevel(PX+PW,0,6,LH,true);
  const box=(x,y,w,h,label,val,col)=>{bevel(x,y,w,h,true);txt(label,x+8,y+5,C.dim,12);if(val!==undefined)txt(val,x+8,y+20,col,16);};
  box(12,12,PX-24,44,'SCORE',String(score).padStart(6,'0'),C.yellow);
  box(12,64,PX-24,44,'HI',String(Math.max(score,save.best)).padStart(6,'0'),C.text);
  box(12,116,PX-24,44,'SHIPS');for(let i=0;i<lives;i++)ctx.drawImage(IMG.player||SHIP,X(20+i*22),X(131),24,22);
  box(12,168,PX-24,44,'WAVE',boss||bossWarn?'BOSS':String(level),boss||bossWarn?C.red:C.text);
  box(12,220,PX-24,56,'CHAIN','x'+chainMultiplier(),chainT>0?C.yellow:C.dim);
  ctx.fillStyle=C.s1;ctx.fillRect(X(20),X(264),X(PX-40),X(4));ctx.fillStyle=C.yellow;ctx.fillRect(X(20),X(264),X((PX-40)*chainT/CHAIN_TIME),X(4));
  txt('3 kills: +1x',PX/2,284,C.dim,9,'center');
  const rx=PX+PW+12,rw=LW-PX-PW-24;
  box(rx,12,rw,44,'GUN',GUN[wpn].n,C.cyan);for(let i=0;i<5;i++){ctx.fillStyle=i<=wpn?C.cyan:C.s1;ctx.fillRect(X(rx+rw-34+i*6),X(18),X(4),X(8));}
  box(rx,64,rw,44,'SHIELD');for(let i=0;i<2;i++){ctx.globalAlpha=i<shield?1:0.25;ctx.drawImage(SHF[Math.floor(t/4)%8],X(rx+8+i*30),X(80),X(24),X(24));ctx.globalAlpha=1;}
  box(rx,116,rw,44,'CORES',String(cores),C.cyan);
  box(rx,168,rw,44,TOUCH?'BOMB  (tap)':'BOMB');if(!TOUCH)keycap('X',rx+rw-15,171);for(let i=0;i<3;i++){ctx.globalAlpha=i<bombs?1:0.2;ctx.fillStyle=C.G;ctx.fillRect(X(rx+8+i*18),X(186),X(12),X(16));ctx.fillStyle=C.white;ctx.fillRect(X(rx+11+i*18),X(183),X(6),X(3));ctx.globalAlpha=1;}
  bevel(rx,LH-48,rw,36,true);txt('640K',rx+rw/2,LH-44,C.text,16,'center');txt('GAMES',rx+rw/2,LH-27,C.dim,12,'center');
  bevel(rx,LH-88,rw,30,SFX.isMuted());txt(SFX.isMuted()?'SOUND OFF':'SOUND ON',rx+rw/2-(TOUCH?0:5),LH-78,SFX.isMuted()?C.dim:C.cyan,11,'center');if(!TOUCH)keycap('M',rx+rw-15,LH-79);}
function playScene(){const sx=shake?Math.round((Math.random()-0.5)*shake):0,sy=shake?Math.round((Math.random()-0.5)*shake):0;if(shake>0)shake-=1;
  ctx.save();ctx.translate(sx,sy);drawField();ctx.restore();drawPanels();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash/12)+')';ctx.fillRect(X(PX),0,X(PW),H);flash--;}
  if(evt>0&&mode==='play'){ctx.save();ctx.globalAlpha=Math.min(1,evt/12);glassPanel(PX+50,48,PW-100,25,evtCol);txt(evtText,LW/2,54,evtCol,12,'center');ctx.restore();}
  if(hint>0&&mode==='play'&&!paused){glassPanel(PX+32,LH-30,PW-64,23,'#55c5d8');txt(TOUCH?'DRAG TO MOVE / AUTO-FIRE':'ARROWS / WASD TO MOVE / AUTO-FIRE',LW/2,LH-24,'#d2e8ef',11,'center');}}
function bootScreen(){ctx.fillStyle=C.black;ctx.fillRect(0,0,W,H);const L=[];const line=(n,s,c)=>{if(t>n)L.push([s,c||DOS.grey]);if(t===n+1&&s)SFX.boot();};
  line(0,'Starting DOS...');line(30,'');line(40,'HIMEM is testing extended memory...done.');line(80,'640K Sound System v1.0 installed. AdLib compatible.');
  line(110,'');line(120,'C:\\>cd games\\spore');line(150,'C:\\GAMES\\SPORE>spore.exe');line(180,'');line(185,'SPORE WARS  (c) 1991 '+BRAND);
  line(200,'VGA detected. 256 colours. 590K conventional memory free.');line(230,'');
  L.forEach((l,i)=>txt(l[0],16,16+i*20,l[1],16));
  if(t<=230&&Math.floor(blink/16)%2===0){ctx.fillStyle=DOS.grey;ctx.fillRect(X(16),X(16+L.length*20),X(10),X(16));}
  if(t>250){if(assetsReady||assetsFailed)txt('Press any key or tap to continue . . .',16,16+L.length*20+8,DOS.white,16);else txt('Loading graphics'+'.'.repeat(Math.floor(t/15)%4),16,16+L.length*20+8,DOS.white,16);}}
let titleSel=0,paused=false;
const TITLE_BUTTONS=[{x:40,y:178,w:230,h:38},{x:40,y:224,w:230,h:32},{x:40,y:264,w:230,h:30}];
// Translucent surfaces keep the scene visible; text remains fully opaque.
function glassPanel(x,y,w,h,accent){
  ctx.save();ctx.fillStyle='rgba(5,12,22,0.55)';ctx.fillRect(X(x),X(y),X(w),X(h));
  ctx.strokeStyle=accent||'#435765';ctx.lineWidth=X(0.5);ctx.strokeRect(X(x)+0.5,X(y)+0.5,X(w)-1,X(h)-1);
  ctx.fillStyle=accent||'#597481';ctx.fillRect(X(x),X(y),X(2),X(h));ctx.restore();
}
function titleScreen(){
  ctx.fillStyle='#050a12';ctx.fillRect(0,0,W,H);
  if(IMG.menu_hangar){ctx.save();ctx.imageSmoothingEnabled=true;ctx.drawImage(IMG.menu_hangar,0,0,W,H);ctx.restore();}
  else{
    // A complete title remains usable when the illustration is unavailable.
    for(const st of STARS){ctx.fillStyle=st.c;ctx.fillRect(st.x,(st.y+scroll*0.3)%H,st.s,st.s);}
    ctx.strokeStyle='#263b4c';ctx.lineWidth=X(3);ctx.strokeRect(X(355),X(42),X(230),X(265));
    const b=IMG.player||SHIP;ctx.drawImage(b,X(470)-b.width,X(190)-b.height,b.width*2,b.height*2);
  }
  const shade=ctx.createLinearGradient(0,0,X(360),0);shade.addColorStop(0,'rgba(3,8,16,0.45)');shade.addColorStop(1,'rgba(3,8,16,0)');
  ctx.fillStyle=shade;ctx.fillRect(0,0,X(360),H);
  txt(BRAND,40,25,'#94acb9',11);
  ctx.fillStyle='#39c7df';ctx.fillRect(X(40),X(49),X(28),X(2));
  txt('SPORE',42,66,'#102331',48);txt('SPORE',40,64,'#dbe8eb',48);
  txt('WARS',42,112,'#102331',48);txt('WARS',40,110,'#dbe8eb',48);
  txt('Beyond the last machine.',42,159,'#8faebc',11);
  const labels=['LAUNCH','WORKSHOP',SFX.isMuted()?'SOUND: OFF':'SOUND: ON'];
  TITLE_BUTTONS.forEach((b,i)=>{const hot=titleSel===i;
    glassPanel(b.x,b.y,b.w,b.h,hot?'#56dcf1':'#3d5364');
    if(hot){ctx.fillStyle='rgba(39,160,190,0.12)';ctx.fillRect(X(b.x+2),X(b.y+1),X(b.w-3),X(b.h-2));}
    txt(labels[i],b.x+20,b.y+(i===0?10:8),hot?'#a3f2ff':'#adc0cd',i===0?19:13);
    if(hot)txt('>',b.x+7,b.y+(i===0?12:8),'#56dcf1',13);
    if(!TOUCH)txt(i===0?'ENTER':i===1?'Q':'M',b.x+b.w-10,b.y+12,'#7e9aa9',9,'right');
  });
  txt(TOUCH?'Drag to move / tap BOMB to clear fire':'ARROWS / WASD  move    X  bomb    P  pause',40,313,'#93a9b8',10);
  ctx.save();ctx.font=X(7)+'px monospace';ctx.fillStyle='#788a98';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText('Art: Skorpio / Daniel Cook / chabull / LuminousDragonGames',X(40),X(336));
  ctx.fillText('Music: Alexandr Zhelanov / Menu: AI-assisted',X(40),X(348));ctx.restore();
}

function deadScreen(){playScene();glassPanel(PX+24,80,PW-48,200,'#b86a72');
  txt('FLEET LOST',LW/2,100,C.red,28,'center');txt('score '+score+'   wave '+level+'   +'+cores+' cores',LW/2,144,C.white,16,'center');
  if(!usedContinue)txt('[C] continue',LW/2,184,C.cyan,16,'center'); // rewarded-ad hook (README item 4): wire to SDK later
  txt('enter / tap  retry   ·   [Q] workshop',LW/2,212,C.orange,16,'center');
  if(score>=save.best&&score>0)txt('new best!',LW/2,244,C.yellow,16,'center');
  txt(TOUCH?'tap here  main menu':'[ESC] main menu',LW/2,262,C.dim,14,'center');}
function pauseScreen(){glassPanel(PX+40,LH/2-50,PW-80,100,'#55c5d8');txt('PAUSED',LW/2,LH/2-36,'#d2e8ef',28,'center');
  txt(TOUCH?'tap to resume':'enter / P  resume',LW/2,LH/2+2,C.white,14,'center');txt('esc: menu / cores saved',LW/2,LH/2+24,'#a4b8c6',12,'center');}
const SHOP=[{k:'weapon',name:'Starting gun',desc:'begin each run with a better gun',cost:l=>80+l*120,max:2},
  {k:'shield',name:'Starting shield',desc:'absorb hits before losing a ship',cost:l=>60+l*90,max:2},
  {k:'engine',name:'Engine tune',desc:'move faster',cost:l=>50+l*70,max:3}];
function shopScreen(){ctx.fillStyle='#050a12';ctx.fillRect(0,0,W,H);if(IMG.menu_hangar){ctx.save();ctx.globalAlpha=0.2;ctx.drawImage(IMG.menu_hangar,0,0,W,H);ctx.restore();}txt('WORKSHOP',20,16,'#d2e8ef',24);txt(save.cores+' cores',LW-20,20,C.cyan,16,'right');
  SHOP.forEach((it,i)=>{const y=72+i*68,lvl=save[it.k],maxed=lvl>=it.max,c=it.cost(lvl);glassPanel(12,y-8,LW-24,60,i===shopSel?'#56dcf1':'#3d5364');const col=i===shopSel?C.white:C.text;
    txt(it.name+'  '+'■'.repeat(lvl)+'□'.repeat(it.max-lvl),24,y,col,16);txt(it.desc,24,y+22,'#9bafbd',14);txt(maxed?'max':c+' cores',LW-24,y,i===shopSel?C.cyan:col,16,'right');});
  txt('space/tap: buy   up/down: choose   [Q] back',LW/2,LH-32,C.text,14,'center');}
function buy(){const it=SHOP[shopSel],lvl=save[it.k];if(lvl>=it.max)return;const c=it.cost(lvl);if(save.cores<c){flash=4;SFX.hit();return;}save.cores-=c;save[it.k]=lvl+1;persist();SFX.power();}
// drawField() draws the live world (enemies, boss, booms, floats), and the title uses it as a backdrop:
// clear the run's transient state on every return to the title so nothing bleeds through.
function clearScene(){enemies=[];eshots=[];shots=[];drops=[];booms=[];floats=[];rings=[];boss=null;bossWarn=0;bossDying=0;}
function quitRun(){clearScene();save.cores+=cores-bankedCores;bankedCores=cores;if(score>save.best)save.best=score;persist();paused=false;mode='title';t=0;SFX.bossTheme(false);}
function continueRun(){chain=0;chainT=0;usedContinue=true;mode='play';lives=2;ship.inv=120;eshots=[];enemies=[];flash=6;}

newRun();
let lastT=0,acc=0;
function frame(now){const STEP=1000/60;const dt=lastT?Math.min(50,now-lastT):STEP;lastT=now;acc+=dt;let steps=0;while(acc>=STEP&&steps<3){acc-=STEP;steps++;stepLogic();}render();requestAnimationFrame(frame);}
function stepLogic(){blink++;if(mode!=='play'){t++;scroll=(scroll+0.9)%TH;}
  if(mode==='boot'){bootScreen();if(tapped&&t>60&&(assetsReady||assetsFailed)){SFX.unlock();SFX.preload();SFX.music(true);mode='title';t=0;}}
  else if(mode==='title'){titleScreen();if(tapped&&t>10){const i=tapSrc==='ptr'?TITLE_BUTTONS.findIndex(b=>ptr.x>=b.x&&ptr.x<=b.x+b.w&&ptr.y>=b.y&&ptr.y<=b.y+b.h):titleSel;if(i===1)mode='shop';else if(i===2)SFX.toggleMute();else if(i===0){newRun();mode='play';t=0;}}}
  else if(mode==='play'){if(paused){playScene();pauseScreen();if(tapped)paused=false;}else{if(slow>0){slow--;if(blink%2===0)update();}else update();if(mode==='play')playScene();else deadScreen();}}
  else if(mode==='dead'){deadScreen();if(tapped){if(tapSrc==='ptr'&&ptr.rel>0.48&&ptr.rel<0.58&&!usedContinue)continueRun();else if(tapSrc==='ptr'&&ptr.rel>0.70&&ptr.rel<0.80){clearScene();mode='title';t=0;}else{newRun();mode='play';t=0;}}}
  else if(mode==='shop'){shopScreen();if(tapped){if(tapSrc==='key')buy();else if(ptr.rel<0.85){const row=Math.floor((ptr.rel*LH-64)/68);if(row>=0&&row<3){if(shopSel===row)buy();else shopSel=row;}}else{clearScene();mode='title';}}}
  tapped=false;}
function render(){}
requestAnimationFrame(frame);
})();
</script>
